# Runtime parameters — loaded by AgentRegistry, passed as Graph(config=...).
# Separate from config/agent.yaml (the static manifest).

max_retry: 3
timeout_s: 30

# Microsoft Graph (Teams messaging) integration settings - forwarded to the
# inner workflow graph by TeamsWorkflowGraphNode._parent_config().
teams:
  base_url: "https://graph.microsoft.com/v1.0"
